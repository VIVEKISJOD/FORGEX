return `<main><div class="row sp"><div><div class="mut">${r.n.toUpperCase()}</div><div class="mut">Exercise ${W.i+1} / ${r.ex.length}</div></div><button class="sm" onclick="if(confirm('Leave workout? Progress is saved only if you finish.')){V='app';W=null;render()}">✕</button></div>
<div style="display:flex;justify-content:center;background:rgba(0,0,0,.3);border-radius:22px;padding:12px;margin:12px 0">${demo(x,150)}</div><div class="tag">EXERCISE ${W.i+1}/${r.ex.length}</div><h3 style="margin:4px 0;font-size:24px;font-weight:600">${x[1]}</h3><p class="mut">Target: ${e[1]} × ${e[2]}${e[4]?' · '+e[4]:''}</p>
<div class="card"><h2>SET ${n+1}${n>=e[1]?' (EXTRA)':''}</h2><label>Weight (kg)</label><input id="ww" type="number" inputmode="decimal" value="${lw}" style="font-size:30px;text-align:center"><label>Reps</label><input id="rr" type="number" inputmode="numeric" value="${lr}" style="font-size:30px;text-align:center"><button class="pri" style="min-height:64px;font-size:16px;background:#58d3f0;color:#052029" onclick="doSet()">COMPLETE SET</button></div>
<div class="card">${lg.sets.map((s,i)=>`<div class="row sp"><span>Set ${i+1}</span><b>${s.w} kg × ${s.r}</b></div>`).join('')||'<span class="mut">No sets yet</span>'}</div>
<div class="row w"><button class="sm" onclick="O.ov='<div class=card style=text-align:left><h3>${x[1]}</h3><ol>${x[5].split('|').map(s=>'<li>'+s+'.</li>').join('')}</ol></div>';render()">Instructions</button><button class="sm" onclick="e_()">Add set</button><button class="sm" onclick="W.i=Math.min(r_(),W.i+1);render()">Skip ▸</button><button class="sm" onclick="W.i=Math.max(0,W.i-1);render()">◂ Prev</button></div><div class="row sp" style="margin:16px 0 8px"><span>Next exercises</span><span class="mut">${r.ex.length-W.i-1} remaining</span></div>${r.ex.slice(W.i+1).map(e=>{const y=getEx(e[0]);return `<div class="er"><div class="th">${exImg(y,34)}</div><div style="flex:1"><div>${y[1]}</div><div class="mut">${e[1]} sets · ${e[2]} reps</div></div></div>`}).join('')}<button class="pri" style="margin-top:14px" onclick="finish()">FINISH WORKOUT</button></main>`}
const r_=()=>W.r.ex.length-1,e_=()=>{W.r.ex[W.i][1]++;render()};
function doSet(){const w=+$('#ww').value||0,r=+$('#rr').value||0;if(r<=0){alert('Enter reps');return}const lg=W.log[W.i],e=W.r.ex[W.i];lg.sets.push({w,r});const last=W.i==r_()&&lg.sets.length>=e[1];if(lg.sets.length>=e[1]&&W.i<r_()&&!last){W.i++}W.rest=last?0:e[3]||60;if(last){finish();return}clearInterval(tmr);tmr=setInterval(()=>{if(W.rest>0){W.rest--;if(!W.rest)clearInterval(tmr);render()}},1000);render()}
function finish(){clearInterval(tmr);const sets=W.log.reduce((a,l)=>a+l.sets.length,0);if(!sets){alert('Complete at least one set first.');W.rest=0;return render()}
const reps=W.log.reduce((a,l)=>a+l.sets.reduce((b,s)=>b+s.r,0),0),vol=W.log.reduce((a,l)=>a+l.sets.reduce((b,s)=>b+s.w*s.r,0),0),prs=[];
W.log.forEach(l=>{if(!l.sets.length)return;const best=Math.max(...l.sets.map(s=>s.w*(1+s.r/30))),old=S.hist.reduce((m,h)=>{const x=h.log.find(z=>z.id==l.id);return x?Math.max(m,...x.sets.map(s=>s.w*(1+s.r/30))):m},0);if(old>0&&best>old+.01){const bs=l.sets.reduce((a,s)=>s.w*(1+s.r/30)>a.w*(1+a.r/30)?s:a);prs.push(getEx(l.id)[1]+' — '+bs.w+' kg × '+bs.r)}});
const planned=W.r.ex.reduce((a,e)=>a+e[1],0),before=streaks().cur,hadToday=S.hist.some(h=>h.d==today());
S.hist.push({d:today(),n:W.r.n,log:W.log.filter(l=>l.sets.length),dur:Math.round((Date.now()-W.t0)/6e4),sets,reps,vol,pr:prs.length,full:sets>=planned});
let xp=100+sets*10+prs.length*50;const st=streaks().cur;if(!hadToday&&st>before){if(st%7==0&&st%30)xp+=100;if(st%30==0)xp+=500}
const wk=days().filter(d=>dn(today())-dn(d)<7).length;if(wk==S.gp&&!hadToday)xp+=100;
const lv=addXp(xp);save();clearInterval(tmr);V='done';O.res={xp,sets,reps,vol,prs,dur:S.hist[S.hist.length-1].dur,st,lv};W=null;render()}
function done(){const r=O.res,T=TH[S.th];return `<main style="text-align:center;position:relative"><div class="ring" style="left:calc(50% - 40px);top:80px"></div><h2 style="margin-top:50px">${T.sys}</h2><h1 style="font-size:28px;letter-spacing:3px">WORKOUT COMPLETE</h1><div class="big lv" style="color:var(--a)">+${r.xp} XP</div><div>🔥 ${r.st} DAY STREAK</div><div class="card" style="margin-top:14px;text-align:left"><div class="row sp"><span>Duration</span><b>${r.dur} min</b></div><div class="row sp"><span>Sets</span><b>${r.sets}</b></div><div class="row sp"><span>Reps</span><b>${r.reps}</b></div><div class="row sp"><span>Volume</span><b>${Math.round(r.vol)} kg</b></div></div>${r.prs.length?`<div class="card"><h2>NEW RECORD · +${r.prs.length*50} XP</h2>${r.prs.map(p=>`<div>${p}</div>`).join('')}</div>`:''}<p class="mut">NEXT LEVEL: ${1000-S.xp%1000} XP</p><button class="pri" onclick="${r.lv?'V=\'app\';TAB=\'home\';lvUp('+r.xp+')':'V=\'app\';TAB=\'home\';render()'}">FINISH</button></main>`}
function lvUp(x){O.ov=`<div class="ring"></div><div class="ring" style="animation-delay:.3s"></div><div class="lv"><h2>${S.th=='solo'?'[ SYSTEM ]':TH[S.th].n.toUpperCase()}</h2><h1>LEVEL UP</h1><div class="big">LEVEL ${lvl()}</div><p>NEW RANK: ${rank()}</p><p class="mut">+${x} XP</p></div>`;render()}
/* progress */
function progress(){const st=streaks(),H=S.hist,tot=H.reduce((a,h)=>[a[0]+h.sets,a[1]+h.reps,a[2]+h.vol],[0,0,0]);if(!H.length)return `<h1 style="font-size:22px;margin-bottom:12px">PROGRESS</h1><div class="card"><h3>NO WORKOUTS YET</h3><p class="mut">Your first XP is waiting.</p><button class="pri" onclick="startR(S.routines[0])">START FIRST WORKOUT</button></div>${wtCard()}`;
const wk=[...Array(8)].map((_,i)=>{const e=dn(today())-i*7;return H.filter(h=>dn(h.d)<=e&&dn(h.d)>e-7).length}).reverse(),mx=Math.max(1,...wk);
const prs=H.reduce((a,h)=>a+h.pr,0),ms=[3,7,14,30,60,100,365];
return `<h1 style="font-size:22px;margin-bottom:12px">PROGRESS</h1><div class="card"><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div><b>${H.length}</b><br>Workouts</div><div><b>${st.cur}</b><br>Streak</div><div><b>${st.best}</b><br>Longest</div><div><b>${tot[0]}</b><br>Sets</div><div><b>${tot[1]}</b><br>Reps</div><div><b>${Math.round(tot[2])}</b><br>Vol kg</div></div></div>
<div class="card"><h2>WORKOUTS PER WEEK (8 WEEKS)</h2><svg viewBox="0 0 240 90" width="100%">${wk.map((v,i)=>`<rect x="${i*30+4}" y="${80-v/mx*70}" width="22" height="${v/mx*70}" rx="5" fill="var(--a)"/><text x="${i*30+15}" y="${74-v/mx*70}" fill="#fff" font-size="9" text-anchor="middle">${v||''}</text>`).join('')}</svg></div>${wtCard()}
<div class="card"><h2>ACHIEVEMENTS · ${prs} PRs</h2>${ms.map(m=>`<span class="chip" style="opacity:${st.best>=m?1:.35}">${st.best>=m?'🏅':'🔒'} ${m}d</span>`).join('')}<p class="mut" style="margin-top:8px">Missing a day isn't failure. Rest days count, and streaks allow a rest day between sessions.</p></div>
<div class="card"><h2>RECENT</h2>${H.slice(-5).reverse().map(h=>`<div class="row sp"><span>${h.d} · ${h.n}</span><span class="mut">${h.sets} sets</span></div>`).join('')}</div>`}
function wtCard(){const w=S.wts;return `<div class="card"><h2>BODY WEIGHT</h2>${w.length>1?(()=>{const lo=Math.min(...w.map(x=>x.w))-1,hi=Math.max(...w.map(x=>x.w))+1;return `<svg viewBox="0 0 240 70" width="100%"><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${w.map((x,i)=>`${10+i*220/(w.length-1)},${60-(x.w-lo)/(hi-lo)*50}`).join(' ')}"/></svg>`})():`<p class="mut">${w.length?w[0].w+' kg · add another entry to see a graph':'No entries yet'}</p>`}<div class="row"><input id="wi" type="number" placeholder="kg" style="margin:0"><button class="sm" onclick="const v=+$('#wi').value;if(v>0){S.wts.push({d:today(),w:v});save();render()}">Log</button></div></div>`}
/* profile */
function profile(){const p=S.p||{},st=streaks();return `<h1 style="font-size:22px;margin-bottom:12px">PROFILE</h1><div class="card row">${logo(56)}<div><h3>${p.n}</h3><div class="mut">LV ${lvl()} · ${rank()} · ${TH[S.th].n}</div><div class="mut">🔥 ${st.cur} · best ${st.best} · ${S.hist.length} workouts</div></div></div>
<div class="card"><h2>TRAINING UNIVERSE</h2><div class="row w">${Object.keys(TH).map(k=>`<button class="sm ${S.th==k?'on':''}" onclick="swU('${k}')">${TH[k].ic} ${TH[k].n}</button>`).join('')}</div></div>
<div class="card"><h2>APPEARANCE · BACKGROUND INTENSITY</h2><div class="row w">${['minimal','normal','cinematic'].map(k=>`<button class="sm ${S.int==k?'on':''}" onclick="S.int='${k}';save();apply();render()">${k}</button>`).join('')}</div><div class="row sp" style="margin-top:10px"><span>Reduce motion</span><button class="sm ${S.rm?'on':''}" onclick="S.rm=!S.rm;save();apply();render()">${S.rm?'ON':'OFF'}</button></div></div>
<div class="card"><h2>GOALS & SCHEDULE</h2><label>Weekly workout goal (days)</label><div class="row w">${[2,3,4,5,6].map(v=>`<button class="sm ${S.gp==v?'on':''}" onclick="S.gp=${v};save();render()">${v}</button>`).join('')}</div><p class="mut">Goals: ${(p.g||[]).join(', ')||'—'}. Set each routine's days in WORKOUT.</p></div>
<div class="card"><h2>CUSTOM BACKGROUND · ${TH[S.th].n.toUpperCase()}</h2><div class="row w"><button class="sm" onclick="$('#bgf').click()">Choose image</button>${S.bg&&S.bg[S.th]?'<button class="sm" onclick="S.bg[S.th]=null;save();apply();render()">Remove</button>':''}<input id="bgf" type="file" accept="image/*" hidden onchange="setBg(this)"></div><p class="mut">Pick any image from your phone. It stays on this device.</p></div><div class="card"><h2>NOTIFICATIONS</h2><button class="sm" onclick="notif()">Enable workout reminders</button><p class="mut">Reminders show while FORGEX is open; background push needs a server, which this offline version doesn't use.</p></div>
<div class="card"><h2>DATA · stored locally on your device</h2><div class="row w"><button class="sm" onclick="exp()">Export JSON</button><button class="sm" onclick="expC()">Export CSV</button><button class="sm" onclick="$('#imp').click()">Import</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div><button class="sm" style="margin-top:10px" onclick="resetAll()">Reset & start from scratch</button></div>
<p class="mut" style="text-align:center">FORGEX is a fitness app, not a medical device. Consult a professional about injuries or health conditions. Original art inspired by anime atmospheres; not affiliated with any franchise.</p>`}
function swU(k){if(k==S.th)return;O.ov=`<div class="card" onclick="event.stopPropagation()"><h3>SWITCH TRAINING UNIVERSE?</h3><p class="mut">Current: ${TH[S.th].n}<br>New: ${TH[k].n}<br>XP, level, streaks and routines are kept.</p><div class="row"><button style="flex:1" onclick="O.ov=null;render()">CANCEL</button><button class="pri" style="flex:1" onclick="S.th='${k}';save();apply();O.ov=null;render()">SWITCH</button></div></div>`;O.noclose=1;render();O.noclose=0}
function dl(n,t,m){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
const exp=()=>dl('forgex-backup.json',JSON.stringify(S),'application/json');
const expC=()=>dl('forgex-history.csv','date,routine,exercise,set,kg,reps\n'+S.hist.flatMap(h=>h.log.flatMap(l=>l.sets.map((s,i)=>[h.d,h.n,getEx(l.id)[1],i+1,s.w,s.r].join(',')))).join('\n'),'text/csv');
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.hist||!d.routines)throw 0;S=d;save();apply();render();alert('Imported')}catch(e){alert('Invalid FORGEX backup file')}})}
function notif(){if(!('Notification' in window)){alert('Notifications not supported here');return}Notification.requestPermission().then(r=>alert(r=='granted'?'Enabled. Reminders appear while the app is open.':'Permission not granted'))}
setInterval(()=>{try{if(S.p&&Notification.permission=='granted'&&new Date().getHours()==18&&new Date().getMinutes()==0&&!S.hist.some(h=>h.d==today())&&!sessionStorage.n){sessionStorage.n=1;new Notification('FORGEX',{body:'Your quest is waiting.'})}}catch(e){}},30000);
if(S.p)V='app';apply();render();
</script></body></html>
